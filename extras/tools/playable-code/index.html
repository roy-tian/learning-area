<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>代码操场</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts/codedb.js" defer></script>
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <h2>实时输出</h2>
    <div class="output" aria-live="polite"></div>
    
    <h2>可编辑代码</h2>
    <label for="code" class="a11y-label">编辑区域：按 ESC 退出编辑区域，按 Tab 可插入制表符 <code>'\t'</code> </label>
    <textarea id="code" class="input"></textarea>
    
    <div class="controls">
    <button type="button" id="btn-reset">重置</button>
    <button type="button" id="btn-solution">显示答案</button>
    <label for="select-items">练习：</label>
    <select id="select-items"></select>
    </div>
  </body>
</html>
