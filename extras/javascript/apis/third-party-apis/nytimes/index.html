<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>《纽约时报》API 示例</title>
  <link href="nytimes.css" rel="stylesheet">
</head>
<body>
  <h1>《纽约时报》文章搜索</h1>

  <div class="wrapper">

    <div class="controls">
      <form>
        <p>
          <label for="search">输入一个搜索词（必填）：</label>
          <input type="text" id="search" class="search" required>
        </p>
        <p>
          <label for="start-date">输入开始日期（格式为 YYYYMMDD）：</label>
          <input type="date" id="start-date" class="start-date" pattern="[0-9]{8}">
        </p>
        <p>
          <label for="end-date">输入结束日期（格式为 YYYYMMDD）：</label>
          <input type="date" id="end-date" class="end-date" pattern="[0-9]{8}">
        </p>
        <p>
          <button class="submit">提交搜索</button>
        </p>
      </form>
    </div>

    <div class="results">
      <nav>
        <button class="prev">前 10 条</button>
        <button class="next">后 10 条</button>
      </nav>

      <section>
      </section>
    </div>

  </div>

  <script>
  // 定义 baseURL 和 key，将它们用于请求 URL

  const baseURL = 'https://api.nytimes.com/svc/search/v2/articlesearch.json';
  const key = '3Cm3bHxG1I3ROE2N94Y8vw7347XEAaQk';
  let url;

  // 获取需要操作的所有 DOM 元素的引用

  const searchTerm = document.querySelector('.search');
  const startDate = document.querySelector('.start-date');
  const endDate = document.querySelector('.end-date');
  const searchForm = document.querySelector('form');

  // This is never used
  // const submitBtn = document.querySelector('.submit');

  const nextBtn = document.querySelector('.next');
  const previousBtn = document.querySelector('.prev');

  const section = document.querySelector('section');
  const nav = document.querySelector('nav');

  // 开始时隐藏“上一页”/“下一页”导航，因为暂时不需要它
  nav.style.display = 'none';

  // 定义初始页码和导航显示状态
  let pageNumber = 0;

  // This is never used
  // let displayNav = false;

  // 用于控制功能的事件监听器


  // 用于控制功能的事件监听器
  searchForm.addEventListener('submit', submitSearch);
  nextBtn.addEventListener('click', nextPage);
  previousBtn.addEventListener('click', previousPage);

  function submitSearch(e){
    pageNumber = 0;
    fetchResults(e);
  }

  function fetchResults(e) {
    // 使用 preventDefault() 阻止表单提交
    e.preventDefault();

    // 拼接完整 URL
    url = baseURL + '?api-key=' + key + '&page=' + pageNumber + '&q=' + searchTerm.value + '&fq=document_type:("article")';

    if(startDate.value !== '') {
      url += '&begin_date=' + startDate.value;
    };

    if(endDate.value !== '') {
      url += '&end_date=' + endDate.value;
    };

    // 使用 fetch() 向 API 发出请求
    fetch(url).then(function(result) {
      return result.json();
    }).then(function(json) {
      displayResults(json);
    });
  }

  function displayResults(json) {
    while (section.firstChild) {
      section.removeChild(section.firstChild);
    }

    const articles = json.response.docs;

    if(articles.length === 10) {
      nav.style.display = 'block';
    } else {
      nav.style.display = 'none';
    }

    if(articles.length === 0) {
      const para = document.createElement('p');
      para.textContent = '没有返回结果。'
      section.appendChild(para);
    } else {
      for(let i = 0; i < articles.length; i++) {
        const article = document.createElement('article');
        const heading = document.createElement('h2');
        const link = document.createElement('a');
        const img = document.createElement('img');
        const para1 = document.createElement('p');
        const para2 = document.createElement('p');
        const clearfix = document.createElement('div');

        const current = articles[i];
        console.log(current);

        link.href = current.web_url;
        link.textContent = current.headline.main;
        para1.textContent = current.snippet;
        para2.textContent = '关键词：';
        for(let j = 0; j < current.keywords.length; j++) {
          const span = document.createElement('span');
          span.textContent = current.keywords[j].value + ' ';
          para2.appendChild(span);
        }

        if(current.multimedia.length > 0) {
          img.src = 'http://www.nytimes.com/' + current.multimedia[0].url;
          img.alt = current.headline.main;
        }

        clearfix.setAttribute('class','clearfix');

        article.appendChild(heading);
        heading.appendChild(link);
        article.appendChild(img);
        article.appendChild(para1);
        article.appendChild(para2);
        article.appendChild(clearfix);
        section.appendChild(article);
      }
    }
  };

  function nextPage(e) {
    pageNumber++;
    fetchResults(e);
  };

  function previousPage(e) {
    if(pageNumber > 0) {
      pageNumber--;
      fetchResults(e);
    }
  };

  </script>


</body>
</html>
