<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>简单 forEach 示例</title>
  </head>
  <body>
    <script>
    const gods = ['Apollo', 'Artemis', 'Ares', 'Zeus'];

    gods.forEach(function (eachName, index){
      console.log(index + '. ' + eachName);
    });
    </script>
  </body>
</html>
