<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>高级自定义 Promise 示例</title>
  </head>
  <body>
    <script>
      // 定义自定义 Promise 函数

      function timeoutPromise(message, interval) {
        return new Promise((resolve, reject) => {
          if(message === '' || typeof message !== 'string') {
            reject('消息为空或不是字符串');
          } else if(interval < 0 || typeof interval !== 'number') {
            reject('间隔为负数或不是数字');
          } else {
            setTimeout(function(){
              resolve(message);
            }, interval);
          }
        });
      };

      timeoutPromise('你好！', 1000)
      .then(message => {
         alert(message);
      })
      .catch(e => {
        console.log('错误：' + e);
      });
    </script>
  </body>
</html>
