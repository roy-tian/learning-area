<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>原生键盘无障碍</title>
    <style>
      input {
        margin-bottom: 10px;
      }

      button {
        margin-right: 10px;
      }

      a:hover, input:hover, button:hover, select:hover,
      a:focus, input:focus, button:focus, select:focus {
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <h1>链接</h1>

    <p>这是指向 <a href="https://www.mozilla.org">Mozilla</a> 的链接。</p>

    <p>这是另一个链接，指向 <a href="https://developer.mozilla.org">Mozilla 开发者网络</a>。</p>

    <h2>按钮</h2>

    <p>
      <button data-message="这是第一个按钮的消息">点我！</button>
      <button data-message="这是第二个按钮的消息">也点我！</button>
      <button data-message="这是第三个按钮的消息">还有我！</button>
    </p>

    <h2>表单</h2>

    <form>
      <div>
        <label for="name">填写姓名：</label>
        <input type="text" id="name" name="name">
      </div>
      <div>
        <label for="age">输入年龄：</label>
        <input type="text" id="age" name="age">
      </div>
      <div>
        <label for="mood">选择心情：</label>
        <select id="mood" name="mood">
          <option>开心</option>
          <option>难过</option>
          <option>生气</option>
          <option>担心</option>
        </select>
      </div>
    </form>

    <script>
      const buttons = document.querySelectorAll('button');

      for(let i = 0; i < buttons.length; i++) {
        addHandler(buttons[i]);
      }

      function addHandler(button) {
        button.addEventListener('click', function(e) {
          let message = e.target.getAttribute('data-message');
          alert(message);
        })
      }
    </script>
  </body>
</html>
