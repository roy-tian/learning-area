<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>ARIA div 按钮</title>
    <style>
      div {
        background-color: rgb(240, 240, 240);
        font-size: 11px;
        font-family: sans-serif;
        border: 1px outset rgb(218, 218, 218);
        line-height: 20px;
        padding: 0 6px;
        width: 120px;
        text-align: center;
        border-radius: 5px;
        margin-right: 10px;
        cursor: pointer;
        display: inline-block;
      }

      div:hover, div:focus {
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <h2>ARIA div 按钮</h2>

    <div data-message="这是第一个按钮的消息" tabindex="0" role="button">点我！</div>
    <div data-message="这是第二个按钮的消息" tabindex="0" role="button">也点我！</div>
    <div data-message="这是第三个按钮的消息" tabindex="0" role="button">还有我！</div>

    <script>
      const buttons = document.querySelectorAll('div');

      for(let i = 0; i < buttons.length; i++) {
        addHandler(buttons[i]);
      }

      function addHandler(button) {
        button.onclick = function(e) {
          let message = e.target.getAttribute('data-message');
          alert(message);
        }
      }

      document.onkeydown = function(e) {
        if(e.keyCode === 13) { // Enter/Return 键
          document.activeElement.onclick(e);
        }
      };
    </script>
  </body>
</html>
