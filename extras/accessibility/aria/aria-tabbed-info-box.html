<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>ARIA 标签页信息框</title>
  <style>

  /* 通用设置 */

  html {
    font-family: sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
  }

  /* 信息框设置 */

  .info-box {
    width: 450px;
    height: 400px;
    margin: 0 auto;
  }

  /* 信息框标签页样式 */

  ul[role="tablist"] {
    padding-left: 0;
    margin-top: 0;
  }

  li[role="tab"] {
    float: left;
    list-style-type: none;
    width: 150px;
    display: inline-block;
    line-height: 3;
    background-color: red;
    color: black;
    text-align: center;
  }

  li[role="tab"]:focus, li[role="tab"]:hover {
    background-color: #a60000;
    color: white;
  }

  li[role="tab"].active {
    background-color: #a60000;
    color: white;
  }

  /* 信息框面板样式 */

  .info-box .panels {
    clear: both;
    position: relative;
    height: 352px;
  }

  .info-box article {
    background-color: #a60000;
    color: white;
    position: absolute;
    padding: 10px;
    height: 352px;
    top: 0;
    left: 0;
  }

  .info-box .active-panel {
    z-index: 1;
  }



  </style>
</head>
<body>

<section class="info-box">
  <ul role="tablist">
    <li class="active" role="tab" aria-selected="true" aria-setsize="3" aria-posinset="1" tabindex="0">标签页 1</li>
    <li role="tab" aria-selected="false" aria-setsize="3" aria-posinset="2" tabindex="0">标签页 2</li>
    <li role="tab" aria-selected="false" aria-setsize="3" aria-posinset="3" tabindex="0">标签页 3</li>
  </ul>
  <div class="panels">
    <article class="active-panel" role="tabpanel" aria-hidden="false">
      <h2>第一个标签页</h2>

      <p>这是第一个标签页的示例内容，用来演示信息框中可以放置一段较长的文字。你可以切换标签页，查看其他面板中的内容。</p>
    </article>
    <article role="tabpanel" aria-hidden="true">
      <h2>第二个标签页</h2>

      <p>这个标签页没有 Lorem Ipsum 占位文本，不过其中的内容同样并不十分有趣。</p>
    </article>
    <article role="tabpanel" aria-hidden="true">
      <h2>第三个标签页</h2>

      <p>这是第三个标签页的示例内容。下面再放一个有序列表：是不是很有趣？</p>

      <ol>
        <li>第一个列表项。</li>
        <li>第二个列表项。</li>
        <li>第三个列表项。</li>
      </ol>
    </article>
  </div>
</section>

<script>

let tabs = document.querySelectorAll('.info-box li');
let panels = document.querySelectorAll('.info-box article');

for(let i = 0; i < tabs.length; i++) {
  let tab = tabs[i];
  setTabHandler(tab, i);
}

function setTab(e) {
  if(e.type === 'keypress' && e.keyCode !== 13) {
    return;
  }

  let tabPos = Number(this.getAttribute('aria-posinset'))-1;
  for(let i = 0; i < tabs.length; i++) {
    if(tabs[i].getAttribute('class')) {
      tabs[i].removeAttribute('class');
    }

    tabs[i].setAttribute('aria-selected', 'false');
  }

  this.setAttribute('class', 'active');
  this.setAttribute('aria-selected', 'true');

  for(let i = 0; i < panels.length; i++) {
    if(panels[i].getAttribute('class')) {
      panels[i].removeAttribute('class');
    }

    panels[i].setAttribute('aria-hidden', 'true');
  }

  panels[tabPos].setAttribute('class', 'active-panel');
  panels[tabPos].setAttribute('aria-hidden', 'false');
}

function setTabHandler(tab) {
  tab.addEventListener('click', setTab);
  tab.addEventListener('keypress', setTab);
}

</script>

</body>
</html>
