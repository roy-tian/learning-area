<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>基本自定义控件</title>
    <link href="../custom-controls.css" rel="stylesheet">
  </head>
  <body>
    <h1>基本自定义控件</h1>

  <section class="player">
    <video controls>
      <source src="../rabbit320.mp4" type="video/mp4">
      <source src="../rabbit320.webm" type="video/webm">
      <p>你的浏览器不支持 HTML5 视频。你可以改用<a href="../rabbit320.mp4">视频链接</a>。</p>
    </video>

    <div class="controls">
      <button class="playpause">播放</button>
      <button class="stop">停止</button>
      <button class="rwd">后退</button>
      <button class="fwd">前进</button>
      <div class="time">00:00</div>
    </div>
  </section>

  <script src="main.js"></script>
  </body>
</html>
