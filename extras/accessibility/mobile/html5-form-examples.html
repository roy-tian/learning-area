<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>HTML5 表单示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      div {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>HTML5 表单示例</h1>

    <form>
      <div>
        <label for="myBrowser">从此列表中选择浏览器：</label>
        <input list="browsers" name="myBrowser" id="myBrowser">
        <datalist id="browsers">
          <option value="Chrome">
          <option value="Firefox">
          <option value="Internet Explorer">
          <option value="Opera">
          <option value="Safari">
          <option value="Microsoft Edge">
        </datalist>
      </div>
      <div>
        <label for="number">输入数字：</label>
        <input type="number" name="number" id="number">
      </div>
      <div>
        <label for="tel">输入电话号码：</label>
        <input type="tel" name="tel" id="tel">
      </div>
      <div>
        <label for="email">输入电子邮件地址：</label>
        <input type="email" name="email" id="email">
      </div>
      <div>
        <label for="time">输入时间：</label>
        <input type="time" name="time" id="time">
      </div>
      <div>
        <label for="date">输入日期：</label>
        <input type="date" name="date" id="date">
      </div>
    </form>
  </body>
</html>
