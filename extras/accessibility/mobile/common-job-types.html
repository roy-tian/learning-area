<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>常见职业类型示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      div {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>常见职业类型表单</h1>

    <form>
      <div>
        <label for="job">职业类型：</label>
        <select id="job" name="job">
          <option value="">-- 选择职业 --</option>
          <option value="butcher">屠夫</option>
          <option value="baker">面包师</option>
          <option value="candle">蜡烛制造者</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div>
        <label for="other-job">其他职业：</label>
        <input type="text" name="other-job" id="other-job">
      </div>
    </form>

    <script>
      const select = document.querySelector('select');
      const other = document.querySelector('input');

      other.parentElement.style.display = 'none';

      select.onchange = function() {
        if(select.value === 'other') {
          other.parentElement.style.display = 'block';
        } else {
          other.parentElement.style.display = 'none';
        }
      }

    </script>
  </body>
</html>
