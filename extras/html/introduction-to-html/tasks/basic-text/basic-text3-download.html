<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8"/>
    <title>基础 HTML 文本：任务 3</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1em / 1.4 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
      }

      h2 {
        font-size: 1.6rem;
        margin: 0;
      }

      h1, h2, strong {
        color: purple;
      }

      p, em {
        color: gray;
        margin: 0.5em 0;
      }

      * {
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>

  <h1>强调和重要性</h1>

  <p>我在意两件事——音乐和朋友。有一天，我或许能让我的朋友彼此认识，也让他们喜欢我的音乐！</p>

  </body>

</html>
