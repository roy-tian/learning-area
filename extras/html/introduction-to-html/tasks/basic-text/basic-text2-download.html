<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8"/>
    <title>基础 HTML 文本：任务 2</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1em / 1.4 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
      }

      h2 {
        font-size: 1.6rem;
        margin: 0;
      }

      p {
        margin: 0.5em 0;
      }

      ol {
        border: 2px solid purple;
      }

      ul {
        border: 2px solid orange;
      }

      ol, ul {
        padding: 5px 20px;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>

    <h1>查看列表</h1>

    <p>请将下面的我最喜欢的蔬菜列表转换为无序列表。</p>

      黄瓜
      西兰花
      芦笋
      甜椒

    <p>请将下面的操作步骤转换为有序列表。</p>

      先敲门
      有人回应后，说出暗号
      至少等待 5 秒
      转动把手并推门

  </body>

</html>
