<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8"/>
    <title>高级 HTML 文本：任务 1</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1em / 1.4 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
        color: purple;
      }

      dl {
        color: gray;
        margin: 0.5em 0;
      }

      dt {
        font-weight: bold;
        color: purple;
      }

      * {
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>

    <h1>高级 HTML 动物</h1>

    羊驼
    高大、毛茸茸的四足动物，耳朵尖。有时可以骑乘，但脾气暴躁，还会吐口水。非常喜欢列表项。
    森蚺
    一种体型非常大的蟒蛇；它会借助锚点快速穿行，悄悄接近猎物。
    嘻哈河马
    它的描述深不见底。

  </body>

</html>
