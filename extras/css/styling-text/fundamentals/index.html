<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>基础文本样式</title>
    <style>
      html {
        font-size: 10px;
      }

      h1 {
        font-size: 5rem;
        text-transform: capitalize;
        text-shadow: 1px 1px 1px red,
                     2px 2px 1px red;
        text-align: center;
        letter-spacing: 2px;
      }

      h1 + p {
        font-weight: bold;
      }

      p::first-line {
        letter-spacing: 4px;
        word-spacing: 4px;
      }

      p {
        font-size: 1.5rem;
        color: red;
        font-family: Helvetica, Arial, sans-serif;
        line-height: 1.6;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <h1>猫咪汤米</h1>

    <p>我记忆犹新，仿佛这一切就发生在上一顿饭之前……</p>

    <p>猫咪汤米一边说着，一边向后仰起头，想把卡在喉咙深处的异物清理出来。许多肥硕的巷鼠，都曾在这台威风凛凛的潜行机器洞开的喉咙前命丧黄泉。这只都市掠食者真是大自然的奇迹——猫咪汤米有许多故事可以讲。但像今天这样的场合实属罕见，它才开了口。</p>


  </body>
</html>
