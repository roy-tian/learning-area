<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>开关示例</title>
    <style>
      * {
        box-sizing: border-box;
      }

      /* 使用 Flexbox 让控件和标签对齐 */

      li {
        width: 100px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        position: relative;
      }

      /* 设置标签尺寸，使用定位将开、关部分叠放在一起 */

      label {
        width: 20px;
        height: 20px;
        line-height: 20px;
        position: relative;
      }

      label span {
        position: absolute;
      }

      /* 使用 appearance 删除复选框的默认样式，并创建外部开关区域 */

      input[type="checkbox"] {
        -webkit-appearance: none;
        appearance: none;
        width: 44px;
        height: 24px;
        border-radius: 12px;
        border: 2px solid black;
        background: #eee;
        transition: all 0.4s;
      }

      /* 设置 ::before 内容，使其看起来像内部开关，也就是会移动的部分 */

      input[type="checkbox"]::before {
        width: 16px;
        height: 16px;
        border-radius: 9px;
        background-color: black;
        content: '';
        position: absolute;
        top: 7px;
        left: 16%;
        transition: all 0.4s;
      }

      /* 复选框选中时改变外部背景色并移动内部开关，用过渡效果使动画平滑 */

      input[type="checkbox"]:checked {
        background-color: #ffaa00;
        transition: all 0.4s;
      }

      input[type="checkbox"]:checked::before {
        left: 35%;
        transition: all 0.4s;
      }

      /* 选中或未选中时分别显示标签中的“开”和“关” */

      input[type="checkbox"] ~ label .on, input[type="checkbox"]:checked ~ label .off {
        opacity: 0;
      }

      input[type="checkbox"] ~ label .off, input[type="checkbox"]:checked ~ label .on {
        opacity: 1;
      }

      /* 让 Chrome 中的焦点轮廓比默认的粗蓝色轮廓更细 */

      input:focus {
        outline: 1px dotted black;
      }

    </style>
  </head>
  <body>
    <ul>
      <li>
        <input type="checkbox" name="power" id="power">
        <label for="power"><span class="on">开</span> <span class="off">关</span></label>
      </li>
    </ul>
  </body>
</html>
