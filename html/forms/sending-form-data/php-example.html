<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>PHP 表单提交示例</title>
    <style>
      form {
        width: 420px;
      }

      div {
        margin-bottom: 20px;
      }

      label {
        display: inline-block;
        width: 240px;
        text-align: right;
        padding-right: 10px;
      }

      button, input {
        float: right;
      }
    </style>
  </head>
  <body>
    <form method="post" action="php-example.php">
      <div>
        <label for="say">你想说什么问候语？</label>
        <input name="say" id="say" value="你好">
      </div>
      <div>
        <label for="to">你想对谁说？</label>
        <input name="to" value="妈妈">
      </div>
      <div>
        <button>发送我的问候</button>
      </div>
    </form>
  </body>
</html>
