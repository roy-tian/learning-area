<!DOCTYPE html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<title>你的第一个 HTML 表单（添加样式后）</title>
		<style>
			body{
				/* 将表单居中显示在页面上 */
				text-align: center;
			}
			form {
				display: inline-block;
				/* 表单轮廓 */
				padding: 1em;
				border: 1px solid #ccc;
				border-radius: 1em;
			}

			p + p {
				margin-top: 1em;
			}

			label {
				/* 统一尺寸和对齐方式 */
				display: inline-block;
				min-width: 90px;

				text-align: right;
			}

			input,
			textarea {
				/* 确保所有文本框使用相同的字体设置。默认情况下，textarea 使用等宽字体 */
				font: 1em sans-serif;
				/* 统一文本框尺寸 */
				width: 300px;
				box-sizing: border-box;
				/* 统一表单控件边框 */
				border: 1px solid #999;
			}

			input:focus,
			textarea:focus {
				/* 设置轮廓的宽度和样式 */
				outline-style: solid;
				/* 突出显示当前活动元素 */
				outline-color: #000;
			}

			textarea {
				/* 让多行文本框与标签对齐 */
				vertical-align: top;
				/* 提供输入文字的空间 */
				height: 5em;
			}

			.button {
				/* 让按钮与文本框对齐 */
				padding-left: 90px;
				/* 与标签元素的尺寸相同 */
			}

			button {
				/* 此额外边距大致等于标签与文本框之间的间距 */
				margin-left: 0.5em;
			}
		</style>
	</head>

	<body>
		<form action="/my-handling-form-page" method="post">
			<p>
				<label for="name">名字：</label>
				<input type="text" id="name" name="user_name" />
			</p>
			<p>
				<label for="mail">电子邮箱：</label>
				<input type="email" id="mail" name="user_mail" />
			</p>
			<p>
				<label for="msg">信息：</label>
				<textarea id="msg" name="user_message"></textarea>
			</p>
			<p class="button">
				<button type="submit">发送你的信息</button>
			</p>
		</form>
	</body>
</html>
