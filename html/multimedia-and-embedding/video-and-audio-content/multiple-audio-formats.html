<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>多格式音频示例</title>
  </head>
  <body>
    <h1>下面是一个可在所有现代浏览器中播放的音频播放器</h1>

    <audio controls>
      <source src="viper.mp3" type="audio/mp3">
      <source src="viper.ogg" type="audio/ogg">
      <p>你的浏览器不支持 HTML5 音频。请点击<a href="viper.mp3">音频链接</a>收听。</p>
    </audio>
  </body>
</html>
