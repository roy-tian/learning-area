<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>非响应式图片示例</title>
    <style>
      html {
        font-family: sans-serif;
        background-color: gray;
      }

      body {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        background-color: white;
      }

      header {
        background: url(header.jpg) no-repeat center;
        height: 200px;
      }

      section {
        padding: 20px;
      }

      p {
        line-height: 1.5;
      }

      img {
        display: block;
        margin: 0 auto;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      
    </header>

    <main>
      <section>
        <h1>我的网站</h1>

        <p>这是一段用于填充页面的文字。图片的宽度固定且较大，因此在较窄的视口中可能会溢出或缩放，无法根据设备选择合适的资源。</p>

        <img src="elva-800w.jpg" alt="克里斯站着抱着女儿埃尔瓦">

        <p>这是一段位于图片之间的占位文字，用来展示页面内容的布局。</p>

        <img src="elva-fairy-800w.jpg" alt="打扮成小仙女的埃尔瓦">

        <p>页眉图片最初由 <a href="https://www.flickr.com/photos/miwok/17086751527/">Miwok</a> 拍摄。</p>
      </section>
    </main>
  </body>
</html>
