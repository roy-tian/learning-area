<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>响应式 HTML 图片示例</title>
    <style>
      html {
        font-family: sans-serif;
        background-color: gray;
      }

      body {
        max-width: 1200px;
        margin: 0 auto;
        background-color: white;
      }

      header {
        background: url(header.jpg) no-repeat center;
        height: 200px;
      }

      section {
        padding: 20px;
      }

      p {
        line-height: 1.5;
      }

      img {
        display: block;
        margin: 0 auto;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <header>

    </header>

    <main>
      <section>
        <h1>我的网站</h1>

        <p>这是一段用于填充页面的文字。浏览器会根据视口大小选择合适的图片资源，让页面在不同设备上都能正常显示。</p>

        <picture>
          <source media="(width < 800px)" srcset="elva-480w-close-portrait.jpg">
          <source media="(width >= 800px)" srcset="elva-800w.jpg">
          <img src="elva-800w.jpg" alt="克里斯站着抱着女儿埃尔瓦">
        </picture>

        <p>这是一段位于图片之间的占位文字，用来展示页面内容的布局。</p>

        <img srcset="elva-fairy-480w.jpg 480w,
                     elva-fairy-800w.jpg 800w"
             sizes="(width <= 600px) 480px,
                    800px"
             src="elva-fairy-800w.jpg" alt="打扮成小仙女的埃尔瓦">

        <p>页眉图片最初由 <a href="https://www.flickr.com/photos/miwok/17086751527/">Miwok</a> 拍摄。</p>
      </section>
    </main>
  </body>
</html>
