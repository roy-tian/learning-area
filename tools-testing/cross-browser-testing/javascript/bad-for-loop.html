<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>错误的 for 循环</title>
  </head>
  <body>
    <script>
      for(var i = 1; i <= 10; i++) {
        const para = document.createElement('p');
        para.textContent = '这是第 ' + i + ' 个段落。';
        document.body.appendChild(para);
        para.onclick = function() {
          alert('你好，我是第 ' + i + ' 个段落！');
        }
      }
    </script>
  </body>
</html>
