<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
	<meta charset="utf-8">
	<title>隐藏信息面板</title>

  <style>
    html {
      font-family: sans-serif;
    }

    /* || 使用复选框控制信息框的显示 */

    label[for="toggle"] {
      font-size: 3rem;
      position: absolute;
      top: 4px;
      right: 5px;
      z-index: 1;
      cursor: pointer;
    }

    input[type="checkbox"] {
       position: absolute;
       top: -100px;
    }

    /* 信息框样式 */

    aside {
      background-color: #a60000;
      background: linear-gradient(to top left, #ff0000, #a60000);
      color: white;
      font-size: 1.4em;
      text-shadow: 2px 2px 2px black;

      width: 340px;
      height: 98%;
      padding: 10px 1%;

      position: fixed;
      top: 0;
      right: -370px;

      transition: 0.6s all;
    }

    /* 复选框技巧的第二部分——选中状态 */

    input[type=checkbox]:checked + aside {
      right: 0px;
    }
  </style>

  </head>
<body>


  <label for="toggle">❔</label>
  <input type="checkbox" id="toggle">
  <aside>
    <h2>信息</h2>

    <p>关于你的应用的一些重要信息：</p>

    <ol>
      <li>它有一个非常酷的滑出式信息框。</li>
      <li>这个信息框结合使用固定定位和 CSS 过渡，实现平滑滑动。</li>
      <li>它还使用了一种很酷的技术，称为<a href="https://css-tricks.com/the-checkbox-hack/">复选框技巧</a>。</li>
      <li>这让你无需使用任何 JavaScript 就能创建漂亮的“切换开/关”用户界面效果，并且可在 IE9 及更高版本中工作（平滑过渡可在 IE10 及更高版本中工作）。</li>

    </ol>

  </aside>
</body>
</html>
