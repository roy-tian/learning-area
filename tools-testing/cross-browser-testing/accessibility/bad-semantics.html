<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>语义不佳的示例</title>
  </head>
  <body>
    <font size="7">我的标题</font>
    <br><br>
    这是文档的第一个部分。
    <br><br>
    这里也会添加另一个段落。
    <br><br>
    <font size="5">我的子标题</font>
    <br><br>
    这是文档的第一个子部分。我希望人们能够找到这些内容！
    <br><br>
    <font size="5">我的第 2 个子标题</font>
    <br><br>
    这是文档的第二个子部分。我觉得它比上一个更有趣。
  </body>
</html>
