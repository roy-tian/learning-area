<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>语义良好的示例</title>
  </head>
  <body>
    <h1>我的标题</h1>

    <p>这是文档的第一个部分。</p>

    <p>这里也会添加另一个段落。</p>

    <h2>我的子标题</h2>

    <p>这是文档的第一个子部分。我希望人们能够找到这些内容！</p>

    <h2>我的第 2 个子标题</h2>

    <p>这是文档的第二个子部分。我觉得它比上一个更有趣。</p>
  </body>
</html>
