<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>面向对象 JavaScript 示例</title>
  </head>

  <body>
    <p>此示例要求你在浏览器的 JavaScript 控制台中输入命令（参见<a href="https://developer.mozilla.org/zh-CN/docs/Learn/Common_questions/What_are_browser_developer_tools">什么是浏览器开发者工具</a> 了解更多信息）。</p>

  </body>

    <script>
      const person = {
        name: ["Kate", "Smith"],
        age: 32,
        gender: "female",
        interests: ["music", "skiing"],
        bio() {
          alert(
            `${this.name[0]} ${this.name[1]} 是 ${this.age} 岁。她喜欢 ${
              this.interests[0]} 和 ${this.interests[1]}。`,
          );
        },
        greeting() {
          alert(`你好！我是 ${this.name[0]}。`);
        },
      };
      const myDataName = 'height';
      const myDataValue = '1.75m';
      person[myDataName] = myDataValue;
    </script>
</html>
