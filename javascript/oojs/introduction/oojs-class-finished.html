<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>面向对象 JavaScript 类示例</title>
  </head>

  <body>
    <p>此示例要求你在浏览器的 JavaScript 控制台中输入命令（参见<a href="https://developer.mozilla.org/zh-CN/docs/Learn/Common_questions/What_are_browser_developer_tools">什么是浏览器开发者工具</a> 了解更多信息）。</p>

  </body>

    <script>
      function Person(first, last, age, gender, interests) {
        this.name = {
          'first': first,
          'last' : last
        };
        this.age = age;
        this.gender = gender;
        this.interests = interests;
        this.bio = function() {
          alert(this.name.first + ' ' + this.name.last + ' 是 ' + this.age + ' 岁。他喜欢 ' + this.interests[0] + ' 和 ' + this.interests[1] + '。');
        };
        this.greeting = function() {
          alert('你好！我是' + this.name.first + '。');
        };
      };

      let person1 = new Person('Bob', 'Smith', 32, 'male', ['music', 'skiing']);
    </script>
</html>
