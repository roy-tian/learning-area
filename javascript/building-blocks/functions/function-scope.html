<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>函数作用域示例</title>
  </head>
<body>

  <script>
    const x = 1;

    function a() {
      const y = 2;
    }

    function b() {
      const z = 3;
    }

    function output(value) {
      const para = document.createElement('p');
      document.body.appendChild(para);
      para.textContent = `值：${value}`;
    }
  </script>
</body>
</html>
