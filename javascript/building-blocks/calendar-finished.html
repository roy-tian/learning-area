<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>简单日历示例</title>
    <style>
      * {
        box-sizing: border-box;
      }

      ul {
        padding-left: 0;
      }

      li {
        display: block;
        float: left;
        width: 25%;
        border: 2px solid white;
        padding: 5px;
        height: 80px;
        background-color: #4A2DB6;
        color: white;
      }
    </style>
  </head>
  <body>
    <label for="month">选择月份：</label>
    <select id="month">
      <option value="January">一月</option>
      <option value="February">二月</option>
      <option value="March">三月</option>
      <option value="April">四月</option>
      <option value="May">五月</option>
      <option value="June">六月</option>
      <option value="July">七月</option>
      <option value="August">八月</option>
      <option value="September">九月</option>
      <option value="October">十月</option>
      <option value="November">十一月</option>
      <option value="December">十二月</option>
    </select>

    <h1></h1>

    <ul>

    </ul>

    <script>
      const select = document.querySelector("select");
      const list = document.querySelector("ul");
      const h1 = document.querySelector("h1");

      select.addEventListener("change", () => {
        const choice = select.value;
        createCalendar(choice);
      });

      function createCalendar(month) {
        let days = 31;

        if (month === "February") {
          days = 28;
        } else if (
          month === "April" ||
          month === "June" ||
          month === "September" ||
          month === "November"
        ) {
          days = 30;
        }

        list.textContent = "";
        h1.textContent = select.options[select.selectedIndex].textContent;
        for (let i = 1; i <= days; i++) {
          const listItem = document.createElement("li");
          listItem.textContent = i;
          list.appendChild(listItem);
        }
      }

      select.value = "January";
      createCalendar("January");
    </script>
  </body>
</html>
