<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>基础 for 循环示例</title>
    <style>

    </style>
  </head>
  <body>

  <p></p>


    <script>
    const cats = ['Bill', 'Jeff', 'Pete', 'Biggles', 'Jasmin'];
    let info = '我的猫叫 ';
    const para = document.querySelector('p');

    for(let i = 0; i < cats.length; i++) {
      info += cats[i] + ', ';
    }

    para.textContent = info;

    </script>

  </body>
</html>
