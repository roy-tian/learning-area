<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>发射倒计时示例</title>
    <style>

    </style>
  </head>
  <body>


    <script>

    let i = 10;

    while(i >= 0) {
      const para = document.createElement('p');
      if(i === 10) {
        para.textContent = '倒计时 ' + i;
      } else if(i === 0) {
        para.textContent = '发射！';
      } else {
        para.textContent = i;
      }

      document.body.appendChild(para);

      i--;
    }

    </script>

  </body>
</html>
