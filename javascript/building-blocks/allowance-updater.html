<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>零花钱更新示例</title>
  </head>
  <body>
    <label for="shopping-check">购物完成了吗？</label>
    <input type="checkbox" id="shopping-check">

    <p></p>

    <script>
      const checkBox = document.querySelector('input');
      const para = document.querySelector('p');
      let shoppingDone = false;

      checkBox.addEventListener('change', () => {
        checkBox.disabled = true;
        shoppingDone = true;
        updateAllowance();
      });

      function updateAllowance() {
        let childsAllowance;
        if (shoppingDone === true) {
          childsAllowance = 10;
        } else {
          childsAllowance = 5;
        }

        para.textContent = `孩子本周赚了 \$${childsAllowance}。`;
      }

      updateAllowance();
    </script>
  </body>
</html>
