<!DOCTYPE HTML>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器示例</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="player">
      <video controls>
        <source src="video/sintel-short.mp4" type="video/mp4" />
        <source src="video/sintel-short.webm" type="video/webm" />
        <!-- fallback content here -->
      </video>
      <div class="controls">
        <button class="play" data-icon="P" aria-label="播放/暂停切换"></button>
        <button class="stop" data-icon="S" aria-label="停止"></button>
        <div class="timer">
          <div></div>
          <span aria-label="计时器">00:00</span>
        </div>
        <button class="rwd" data-icon="B" aria-label="快退"></button>
        <button class="fwd" data-icon="F" aria-label="快进"></button>
      </div>
    </div>
    <p>Sintel © Blender Foundation 版权所有 | <a href="https://studio.blender.org/films/sintel/">studio.blender.org/films/sintel/</a>.</p>
    <script src="custom-player.js"></script>
  </body>
</html>
