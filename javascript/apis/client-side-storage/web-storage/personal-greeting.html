<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化问候</title>
    <style>
      html {
        font-family: sans-serif;
      }

      body {
        margin: 0 auto;
        max-width: 1024px;
      }

      main {
        padding: 20px;
      }

      header, footer {
        background: cyan;
        padding: 20px;
        border: 1px solid black;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      form {
        font-size: 0.8rem;
      }

      .personal-greeting {
        font-weight: bold;
      }
    </style>
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>我们的网站</h1>

      <form>
        <div class="remember">
          <label for="entername">输入你的姓名：</label>
          <input id="entername" type="text" required>
          <input id="submitname" type="submit" value="打招呼">
        </div>
        <div class="forget">
          <label for="forgetname">要忘记你吗？</label>
          <input id="forgetname" type="reset" value="忘记">
        </div>
      </form>
    </header>

    <main>

      <p class="personal-greeting">欢迎来到我们的网站。</p>

      <p>这是一段用于填充页面的示例文字。这里展示 Web Storage 示例的主体内容；你可以把注意力放在左侧的个性化问候功能上。</p>

      <p>这是一段占位文字，用于让页面看起来更完整。保存姓名后，页面会显示个性化的欢迎语。</p>

      <p>这里还有一段占位文字。点击“忘记我”后，保存的姓名会被从浏览器存储中删除。</p>

    </main>

    <footer>
      <p>版权归属无人。请随意使用代码。</p>
    </footer>
  </body>
</html>
