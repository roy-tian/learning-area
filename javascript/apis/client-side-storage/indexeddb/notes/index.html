<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB 演示</title>
    <link href="style.css" rel="stylesheet">
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>IndexedDB 笔记演示</h1>
    </header>

    <main>
      <section class="note-display">
        <h2>笔记</h2>
        <ul>

        </ul>
      </section>
      <section class="new-note">
        <h2>输入新笔记</h2>
        <form>
          <div>
            <label for="title">笔记标题</label>
            <input id="title" type="text" required>
          </div>
          <div>
            <label for="body">笔记内容</label>
            <input id="body" type="text" required>
          </div>
          <div>
            <button>创建新笔记</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>版权归属无人。请随意使用代码。</p>
    </footer>
  </body>
</html>
