<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单 DOM 示例</title>
    <style>
      .highlight {
        color: white;
        background-color: black;
        padding: 10px;
        width: 250px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section>
      <img src="dinosaur.png" alt="一只红色的霸王龙：像人一样直立的双足恐龙，有小小的手臂和长满锋利牙齿的大脑袋。">
      <p>我们将在这里添加一个指向 <a href="https://www.mozilla.org/">Mozilla 主页</a></p>
    </section>

    <script>
      const link = document.querySelector('a');
      link.textContent = 'Mozilla 开发者网络';
      link.href = 'https://developer.mozilla.org';

      const sect = document.querySelector('section');
      const para = document.createElement('p');
      para.textContent = '希望你喜欢这次体验。';
      sect.appendChild(para);

      const text = document.createTextNode(' — the premier source for web development knowledge.');
      const linkPara = document.querySelector('p');
      linkPara.appendChild(text);

      // You could clone link para by doing something like this and inserting the new para instead
      // var newPara = linkPara.cloneNode(true);

      sect.appendChild(linkPara);
      linkPara.parentNode.removeChild(linkPara);

      para.setAttribute('class', 'highlight');
    </script>
  </body>
</html>
