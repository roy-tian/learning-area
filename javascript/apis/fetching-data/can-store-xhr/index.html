<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>罐头商店（XHR 版）</title>
    <link href="https://fonts.googleapis.com/css?family=Cherry+Swash|Raleway" rel="stylesheet">
    <link href="can-style.css" rel="stylesheet">

  </head>

  <body>
    <header>
      <h1>罐头商店（XHR 版）</h1>
    </header>
    <div>
      <aside>
        <form>
          <div>
            <label for="category">选择分类：</label>
            <select id="category">
              <option value="All" selected>全部</option>
              <option value="Vegetables">蔬菜</option>
              <option value="Meat">肉类</option>
              <option value="Soup">汤类</option>
            </select>
          </div>
          <div>
            <label for="searchTerm">输入搜索词：</label>
            <input type="text" id="searchTerm" placeholder="例如：豆">
          </div>
          <div>
            <button>筛选结果</button>
          </div>
        </form>
      </aside>
      <main>

      </main>
    </div>
    <footer>
      <p>所有图标来自 Noun Project：</p>

      <ul>
        <li>豆罐头图标：<a href="https://thenounproject.com/yalanis/">Yazmin Alanis</a></li>
        <li>蔬菜图标：<a href="https://thenounproject.com/skatakila/">Ricardo Moreira</a></li>
        <li>汤类图标：<a href="https://thenounproject.com/ArtZ91/">Arthur Shlain</a></li>
        <li>肉块图标：<a href="https://thenounproject.com/smashicons/">Oliviu Stoian</a>。</li>
      </ul>
    </footer>
    <script src="can-script.js"></script>
  </body>
</html>
