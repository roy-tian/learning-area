<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">

    <title>猜数字游戏</title>

    <style>
      html {
        font-family: sans-serif;
      }

      body {
        width: 50%;
        max-width: 800px;
        min-width: 480px;
        margin: 0 auto;
      }

      .form input[type="number"] {
        width: 200px;
      }

      .lastResult {
        color: white;
        padding: 3px;
      }
    </style>
  </head>

  <body>
    <h1>猜数字游戏</h1>

    <p>我们随机选出了一个 1 到 100 之间的数字。看看你能否在 10 次以内猜中。我们会告诉你猜得太高还是太低。</p>

    <div class="form">
      <label for="guessField">输入猜测：</label>
      <input type="number" min="1" max="100" required id="guessField" class="guessField">
      <input type="submit" value="提交猜测" class="guessSubmit">
    </div>

    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResult"></p>
      <p class="lowOrHi"></p>
    </div>

    <script>

      // Your JavaScript goes here

    </script>
  </body>
</html>
