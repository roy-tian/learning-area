<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>表单验证示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      form {
        background: #eee;
        border-radius: 20px;
        box-shadow: 1px 1px 1px black;
        padding: 20px;
        width: 330px;
      }

      label {
        width: 160px;
        float: left;
        text-align: right;
        padding: 4px;
        margin-bottom: 20px;
      }

      input {
        width: 130px;
        float: right;
      }

      label, input {
        font-size: 1em;
        line-height: 1.5;
      }

      input[type="checkbox"] {
        height: 24px;
      }

      div {
        clear: both;
      }

      .errors {
        background: yellow;
        border-radius: 20px;
        box-shadow: 1px 1px 1px black;
        padding: 20px;
        width: 300px;
        position: absolute;
        left: 390px;
      }

      .hidden-alert {
        position: absolute;
        left: -100%;
      }
    </style>
  </head>
  <body>
    <h1>表单验证示例</h1>
    <div class="errors" role="alert" aria-relevant="all">
      <ul>

      </ul>

    </div>

    <p>带星号 (*) 的字段为必填项。</p>

    <form>
      <div>
        <label for="name">输入姓名*：</label>
        <input type="text" name="name" id="name" aria-required="true">
      </div>
      <div>
        <label for="age">输入年龄*：</label>
        <input type="number" name="age" id="age" placeholder="请输入 1 到 150" aria-required="true">
      </div>
      <div>
        <label for="musician">音乐人：</label>
        <input type="checkbox" name="musician" id="musician">
      </div>
      <div>
        <label for="instruments">演奏的乐器*：</label>
        <input type="text" name="instruments" id="instruments" aria-required="true">
      </div>
      <div>
        <input type="submit">
      </div>
      <div></div>
    </form>
    <p class="hidden-alert" aria-live="assertive"></p>
    <script src="validation-checkbox-disabled.js"></script>
  </body>
</html>
