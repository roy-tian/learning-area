<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>表单验证示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      form {
        background: #eee;
        border-radius: 20px;
        box-shadow: 1px 1px 1px black;
        padding: 20px;
        width: 300px;
      }

      label {
        width: 130px;
        float: left;
        text-align: right;
        padding: 4px;
        margin-bottom: 20px;
      }

      input {
        width: 130px;
        float: right;
      }

      label, input {
        font-size: 1em;
        line-height: 1.5;
      }

      div {
        clear: both;
      }

      .errors {
        background: yellow;
        border-radius: 20px;
        box-shadow: 1px 1px 1px black;
        padding: 20px;
        width: 300px;
        position: absolute;
        left: 360px;
      }
    </style>
  </head>
  <body>
    <h1>表单验证示例</h1>
    <div class="errors" role="alert" aria-relevant="all">
      <ul>

      </ul>

    </div>
    <form>
      <div>
        <label for="name">输入姓名：</label>
        <input type="text" name="name" id="name">
      </div>
      <div>
        <label for="age">输入年龄：</label>
        <input type="number" name="age" id="age">
      </div>
      <div>
        <input type="submit">
      </div>
      <div></div>
    </form>
    <script src="validation.js"></script>
  </body>
</html>
