<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>表格 CSS 示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      table {
        width: 600px;
        border-collapse: collapse;
        border: 1px solid black;
        border-top: 3px solid black;
        border-bottom: 3px solid black;
      }

      th,td {
        padding: 10px;
      }

      td {
        text-align: center;
      }

      th[scope="col"] {
        background: #ccc;
      }

      tr:nth-child(even) {
        background: #eee;
      }

      tr:nth-child(odd) {
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <h1>表格 CSS 示例</h1>
    <table>
      <tr>
        <th scope="col">姓名</th>
        <th scope="col">年龄</th>
        <th scope="col">性别</th>
      </tr>
      <tr>
        <th scope="row">Gabriel</th>
        <td>13</td>
        <td>男</td>
      </tr>
      <tr>
        <th scope="row">Elva</th>
        <td>8</td>
        <td>女</td>
      </tr>
      <tr>
        <th scope="row">Freida</th>
        <td>5</td>
        <td>女</td>
      </tr>
    </table>
  </body>
</html>
