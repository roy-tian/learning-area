<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>音频文字稿示例</title>
    <link href="../custom-controls.css" rel="stylesheet">
    <style>
      .transcript-container {
        width: 480px;
        margin: 10px auto;
        border: 1px solid #ccc;
        min-height: 38px;
      }

      .transcript {
        height: 0;
        width: 100%;
        overflow: auto;
        padding: 0 10px;
      }

      .transcript-container button {
        width: 100%;
        height: 36px;
      }
    </style>
  </head>
  <body>
    <h1>音频文字稿示例</h1>

  <section class="player">
    <audio controls>
      <source src="../viper.mp3" type="audio/mp3">
      <source src="../viper.ogg" type="audio/ogg">
      <p>你的浏览器不支持 HTML5 音频。你可以改用<a href="../viper.mp3">音频链接</a>。</p>
    </audio>

    <div class="controls">
      <button class="playpause">播放</button>
      <button class="stop">停止</button>
      <button class="rwd">后退</button>
      <button class="fwd">前进</button>
      <div class="time">00:00</div>
    </div>
  </section>
  <div class="transcript-container">
    <div class="transcript-control">
      <button>显示文字稿</button>
    </div>
    <section class="transcript">
      <p><strong>人物 1</strong>：这是第一段音频文字稿示例，用来演示如何显示可展开的文字内容。</p>

      <p><strong>人物 2</strong>：文字稿可以帮助听不见音频的用户了解对话内容，也能让所有用户快速查找信息。</p>

      <p><strong>人物 1</strong>：将文字稿放在播放器旁边，可以让用户按照自己的节奏阅读。</p>

      <p><strong>人物 2</strong>：点击按钮即可展开或隐藏文字稿；播放器的其他控制项仍然可以独立使用。</p>

      <p><strong>人物 3</strong>：这是最后一段示例文字。</p>
    </section>
  </div>

  <script src="main.js"></script>
  </body>
</html>
