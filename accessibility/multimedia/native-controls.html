<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>带原生控件的多个媒体播放器</title>
  </head>
  <body>
    <h1>带原生控件的多个媒体播放器</h1>

    <audio controls>
      <source src="viper.mp3" type="audio/mp3">
      <source src="viper.ogg" type="audio/ogg">
      <p>你的浏览器不支持 HTML5 音频。你可以改用<a href="viper.mp3">音频链接</a>。</p>
    </audio>

    <br>

    <video controls>
      <source src="rabbit320.mp4" type="video/mp4">
      <source src="rabbit320.webm" type="video/webm">
      <p>你的浏览器不支持 HTML5 视频。你可以改用<a href="rabbit320.mp4">视频链接</a>。</p>
    </video>
  </body>
</html>
