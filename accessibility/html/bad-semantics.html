<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>语义不佳的示例</title>
  </head>
  <body>
    <span style="font-size: 3rem">我的标题</span>
    <br><br>
    扬帆起航，船长和水手们整理好缆绳，升起船帆，驶向远方。甲板上堆着补给，瞭望员站在桅杆上观察海面。海盗们欢呼着拉起锚链，准备迎接新的冒险。
    <br><br>
    试航船在海风中转向，炮手检查火炮，水手们在甲板上忙碌。船长发出命令，大家收起缆绳、调整船帆，并向着海盗湾前进。远处的炮声提醒着所有人保持警惕。
    <br><br>
    <span style="font-size: 2.5rem">我的子标题</span>
    <br><br>
    这是文档的第一个子部分。我希望人们能够找到这些内容！这里介绍船只、船员和航海中会遇到的各种工具。
    <br><br>
    <span style="font-size: 2.5rem">我的第 2 个子标题</span>
    <br><br>
    这是文档的第二个子部分。我觉得它比上一个更有趣，尤其是其中关于船只转向和航海路线的内容。
  </body>
</html>
