<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>语义良好的示例</title>
  </head>
  <body>
    <h1>我的标题</h1>

    <p>扬帆起航，船长和水手们整理好缆绳，升起船帆，驶向远方。甲板上堆着补给，瞭望员站在桅杆上观察海面。海盗们欢呼着拉起锚链，准备迎接新的冒险。</p>

    <p>试航船在海风中转向，炮手检查火炮，水手们在甲板上忙碌。船长发出命令，大家收起缆绳、调整船帆，并向着海盗湾前进。远处的炮声提醒着所有人保持警惕。</p>

    <h2>我的子标题</h2>

    <p>这是文档的第一个子部分。我希望人们能够找到这些内容！这里介绍船只、船员和航海中会遇到的各种工具。</p>

    <h2>我的第 2 个子标题</h2>

    <p>这是文档的第二个子部分。我觉得它比上一个更有趣，尤其是其中关于船只转向和航海路线的内容。</p>
  </body>
</html>
