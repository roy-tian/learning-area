<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>无障碍图片示例</title>
    <style>
      img {
        display: block;
        margin: 3em;
      }
    </style>
  </head>
  <body>

    <h1>图片</h1>

    <img src="dinosaur.png">

    <img src="dinosaur.png"
         alt="一只红色的霸王龙：这种两足恐龙像人一样直立，手臂很小，头部很大，还有许多锋利的牙齿。">

    <img src="dinosaur.png"
         alt="一只红色的霸王龙：这种两足恐龙像人一样直立，手臂很小，头部很大，还有许多锋利的牙齿。"
         title="Mozilla 红色恐龙">

    <img src="dinosaur.png" aria-labelledby="dino-label">

    <p id="dino-label">Mozilla 的红色霸王龙：这种两足恐龙像人一样直立，手臂很小，头部很大，还有许多锋利的牙齿。</p>

  </body>
</html>
