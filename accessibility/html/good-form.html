<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>良好表单示例</title>
  </head>
  <body>
    <h1>良好表单</h1>
    <form>
      <div>
        <label for="name">输入姓名：</label>
        <input type="text" name="name" id="name">
      </div>
      <div>
        <label for="age">输入年龄：</label>
        <input type="text" name="age" id="age">
      </div>
    </form>
  </body>
</html>
