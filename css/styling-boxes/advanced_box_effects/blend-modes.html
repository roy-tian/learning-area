<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>CSS 混合模式示例</title>
    <style>
      html {
        font-family: sans-serif;
      }

      body {
        margin: 0;
      }

      div {
        width: 280px;
        height: 130px;
        padding: 10px;
        margin: 10px;
      }

      article {
        width: 330px;
        height: 180px;
        margin: 10px;
        position: relative;
      }

      body > div,
      article div:first-child {
        background: url(https://mdn.github.io/shared-assets/images/examples/colorful-heart.png)
          no-repeat center 20px;
        background-color: green;
      }

      body > div,
      article {
        display: inline-block;
      }

      article div:first-child {
        position: absolute;
        top: 10px;
        left: 0;
      }

      article div:last-child {
        background-color: purple;
        position: absolute;
        bottom: -10px;
        right: 0;
        z-index: -1;
      }

      .multiply {
        background-blend-mode: multiply;
      }

      .multiply-mix {
        mix-blend-mode: multiply;
      }

      .screen {
        background-blend-mode: screen;
      }

      .screen-mix {
        mix-blend-mode: screen;
      }

      .overlay {
        background-blend-mode: overlay;
      }

      .overlay-mix {
        mix-blend-mode: overlay;
      }

      .darken {
        background-blend-mode: darken;
      }

      .darken-mix {
        mix-blend-mode: darken;
      }

      .lighten {
        background-blend-mode: lighten;
      }

      .lighten-mix {
        mix-blend-mode: lighten;
      }

      .color-dodge {
        background-blend-mode: color-dodge;
      }

      .color-dodge-mix {
        mix-blend-mode: color-dodge;
      }

      .color-burn {
        background-blend-mode: color-burn;
      }

      .color-burn-mix {
        mix-blend-mode: color-burn;
      }

      .hard-light {
        background-blend-mode: hard-light;
      }

      .hard-light-mix {
        mix-blend-mode: hard-light;
      }

      .soft-light {
        background-blend-mode: soft-light;
      }

      .soft-light-mix {
        mix-blend-mode: soft-light;
      }

      .difference {
        background-blend-mode: difference;
      }

      .difference-mix {
        mix-blend-mode: difference;
      }

      .hue {
        background-blend-mode: hue;
      }

      .hue-mix {
        mix-blend-mode: hue;
      }
    </style>
  </head>
  <body>
    <h2>背景混合模式</h2>

    <div>无混合模式</div>

    <div class="multiply">正片叠底</div>

    <div class="screen">滤色</div>

    <div class="overlay">叠加</div>

    <div class="color-dodge">颜色减淡</div>

    <div class="color-burn">颜色加深</div>

    <div class="hard-light">强光</div>

    <div class="soft-light">柔光</div>

    <div class="difference">差值</div>

    <div class="hue">色相</div>

    <h2>混合模式</h2>

    <article>
      无混合模式
      <div></div>
      <div></div>
    </article>

    <article>
      正片叠底混合
      <div class="multiply-mix"></div>
      <div></div>
    </article>

    <article>
      滤色混合
      <div class="screen-mix"></div>
      <div></div>
    </article>

    <article>
      叠加混合
      <div class="overlay-mix"></div>
      <div></div>
    </article>

    <article>
      颜色减淡混合
      <div class="color-dodge-mix"></div>
      <div></div>
    </article>

    <article>
      颜色加深混合
      <div class="color-burn-mix"></div>
      <div></div>
    </article>

    <article>
      强光混合
      <div class="hard-light-mix"></div>
      <div></div>
    </article>

    <article>
      柔光混合
      <div class="soft-light-mix"></div>
      <div></div>
    </article>

    <article>
      差值混合
      <div class="difference-mix"></div>
      <div></div>
    </article>

    <article>
      色相混合
      <div class="hue-mix"></div>
      <div></div>
    </article>
  </body>
</html>
